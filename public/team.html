<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <meta name="theme-color" content="#075fd4"/>
    <title>Đội thi Olympia</title>
    <link rel="stylesheet" href="./portal.css"/>
  </head>
  <body class="team-body">
    <main class="team-shell">
      <header><p>ĐƯỜNG LÊN ĐỈNH OLYMPIA 26</p><h1 id="teamName">NHÓM</h1><span id="connectionState">Đang kết nối…</span></header>
      <section class="team-login" id="loginPanel">
        <label for="teamPin">Mã PIN của nhóm</label>
        <div><input id="teamPin" inputmode="numeric" autocomplete="one-time-code" placeholder="••••"/><button id="savePin" type="button">VÀO PHÒNG</button></div>
        <p id="loginStatus" role="status"></p>
      </section>
      <section class="team-wait" id="waitPanel" hidden><div class="pulse-orb"></div><h2>ĐANG CHỜ CÂU HỎI</h2><p>Màn hình sẽ tự chuyển khi admin bắt đầu phần thi.</p></section>
      <section class="team-answer" id="answerPanel" hidden><p id="roundLabel">PHẦN THI</p><h2 id="questionLabel">CÂU HỎI</h2><form id="answerForm"><textarea id="answerInput" rows="4" maxlength="300" placeholder="Nhập câu trả lời…" required></textarea><button type="submit">GỬI CÂU TRẢ LỜI</button></form><p id="answerStatus"></p></section>
      <section class="team-buzz" id="buzzPanel" hidden><p>VỀ ĐÍCH</p><h2>GIÀNH QUYỀN TRẢ LỜI</h2><button id="buzzButton" type="button">BẤM CHUÔNG</button><p id="buzzStatus">Chỉ lượt bấm đầu tiên được ghi nhận.</p></section>
    </main>
    <script type="module" src="./team.js"></script>
  </body>
</html>
